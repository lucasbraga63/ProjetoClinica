<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/formulario.css">
    <title>Solicitar Serviço</title>
</head>
<body>
    <div class="tela-toda">
        <div class="titulo">
            <h2>Solicite um serviço</h2>
        </div>
        <div class="inputs">
            <div class="input">
                <label for="nomeUsuario">Nome do cliente</label>
                <input type="text" id="nomeUsuario" placeholder="Digite seu nome completo">
            </div>
            <div class="input">
                <label for="email">email</label>
                <input type="email" id="email" placeholder="seuemailpessoal@gmail.com">
            </div>
            <div class="input">
                <label for="nomePet">Nome do seu animal</label>
                <input type="text" id="nomePet" placeholder="Digite o nome do seu pet">
            </div>
            <div class="input">
                <label for="tipoAnimal">Tipo do seu animal</label>
                <input type="text" id="tipoAnimal" placeholder="cachorro, gato, rato, pato e etc.">
            </div>
        </div>

        <div class="servicoDesejado">
            <select name="select" id="servicoEscolhido">
             <option value="1">Tosa</option>
            </select>
        </div>
        <div class="campoObs">
            <textarea name="" id=""></textarea>
        </div>
        <div class="botoes">
            <button>Enviar</button>
            <a href="index.html">Voltar ao inicio</a>
        </div>


    </div>
</body>
</html>
